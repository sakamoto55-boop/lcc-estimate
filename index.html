<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LCC 解体・片付け統合見積システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root{
    --lcc-red:#e50914;
    --lcc-dark:#0b0b0d;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:#f1f3f5; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  /* 入力要素は16px以上でズーム誤作動防止 */
  input,select,textarea,button{ font-size:16px; }
  input[type="number"]{ -moz-appearance:textfield; }
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  /* オープニングアニメーション */
  #opening{
    position:fixed; inset:0; z-index:9999;
    background:radial-gradient(ellipse at center, #1a1a1d 0%, #000 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #opening.fade-out{ animation: openFade 1s ease forwards; }
  @keyframes openFade{ to{ opacity:0; visibility:hidden; } }
  .op-logo{
    font-weight:900; letter-spacing:.18em; color:#fff;
    font-size:24vw; line-height:1; position:relative;
    text-shadow:0 0 40px rgba(229,9,20,.55);
    animation: logoIn 2.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .op-logo span{ color:var(--lcc-red); }
  @keyframes logoIn{
    0%{ transform:scale(2.6); opacity:0; filter:blur(14px); letter-spacing:.5em; }
    30%{ opacity:1; filter:blur(0); }
    70%{ transform:scale(1); opacity:1; letter-spacing:.18em; }
    100%{ transform:scale(1); opacity:1; }
  }
  .op-sub{
    margin-top:18px; color:#cfcfcf; letter-spacing:.5em;
    font-size:14px; opacity:0; transform:translateY(10px);
    animation: subIn .9s ease 1.6s forwards;
  }
  .op-sub2{
    margin-top:6px; color:#7d7d7d; letter-spacing:.42em;
    font-size:11px; opacity:0;
    animation: subIn .9s ease 2.0s forwards;
  }
  @keyframes subIn{ to{ opacity:1; transform:translateY(0); } }
  .op-line{
    margin-top:24px; width:0; height:2px; background:var(--lcc-red);
    box-shadow:0 0 12px var(--lcc-red);
    animation: lineIn 1.2s ease 1.9s forwards;
  }
  @keyframes lineIn{ to{ width:160px; } }

  .tab-active{ color:var(--lcc-red); }
  .seg-btn{ transition:all .15s ease; }
  .card{ background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .safe-bottom{ padding-bottom: calc(env(safe-area-inset-bottom) + 76px); }
  .nav-safe{ padding-bottom: env(safe-area-inset-bottom); }

  /* 見積書プレビュー（A4） */
  .a4{
    width:210mm; min-height:297mm; background:#fff; color:#111;
    padding:14mm 12mm; box-sizing:border-box; margin:0 auto;
    font-size:11pt;
  }
  .a4 table{ width:100%; border-collapse:collapse; }
  .a4 .est-tbl th,.a4 .est-tbl td{ border:1px solid #444; padding:4px 6px; }
  .a4 .cat-row td{ background:#f0f0f0; font-weight:700; }
  @media print{
    @page{ size:A4; margin:0; }
    body *{ visibility:hidden; }
    #printArea,#printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; }
    .no-print{ display:none !important; }
    .a4{ box-shadow:none; margin:0; width:100%; min-height:auto; }
  }
  .num-tag{ display:inline-flex; align-items:center; justify-content:center;
    min-width:34px; height:34px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, reactive, computed, ref, onMounted, watch } = Vue;

const STORAGE_KEY = 'lcc_estimate_v1';

/* ===== 既定の単価マスタ（全27項目）===== */
const DEFAULT_RATES = {
  // --- 解体：仮設・本体（㎡・式） ---
  scaffold:        { label:'足場',                 unit:'㎡', price:900,    cat:'解体' },
  soundSheet:      { label:'防音シート',           unit:'㎡', price:600,    cat:'解体' },
  woodDemolish:    { label:'木造解体（上屋）',     unit:'㎡', price:13000,  cat:'解体' },
  steelDemolish:   { label:'S造解体（上屋）',      unit:'㎡', price:18000,  cat:'解体' },
  foundation:      { label:'基礎撤去',             unit:'㎡', price:4500,   cat:'解体' },
  // --- 解体：処分（㎥） ---
  concreteDisp:    { label:'コンガラ処分',         unit:'㎥', price:5500,   cat:'処分' },
  woodDisp:        { label:'木くず処分',           unit:'㎥', price:6000,   cat:'処分' },
  gypsumDisp:      { label:'石膏ボード処分(管理型)', unit:'㎥', price:9000, cat:'処分' },
  mixedDisp:       { label:'混合廃棄物・廃プラ処分', unit:'㎥', price:12000, cat:'処分' },
  // --- 解体：外構・付帯 ---
  blockWall:       { label:'ブロック塀撤去',       unit:'㎡', price:3500,   cat:'外構' },
  doma:            { label:'土間コン撤去',         unit:'㎡', price:2800,   cat:'外構' },
  treeRemoval:     { label:'樹木伐根',             unit:'本', price:8000,   cat:'外構' },
  // --- 解体：諸経費・特殊 ---
  machineTransport:{ label:'重機回送費',           unit:'式', price:60000,  cat:'諸経費' },
  asbestosSurvey:  { label:'アスベスト事前調査費', unit:'式', price:50000,  cat:'諸経費' },
  asbestosDisp:    { label:'石綿(レベル3)特殊処分', unit:'㎡', price:3000,  cat:'諸経費' },
  guard:           { label:'警備員',               unit:'人日', price:18000, cat:'諸経費' },
  laborDemo:       { label:'手壊し・上屋人工',     unit:'人日', price:25000, cat:'諸経費' },
  // --- 片付け：体積・人件 ---
  trashVolume:     { label:'一般ゴミ処分(立米単価)', unit:'㎥', price:8000, cat:'片付け' },
  worker:          { label:'作業員',               unit:'人日', price:18000, cat:'片付け' },
  stairFee:        { label:'階段降ろし割増(1階毎)', unit:'回', price:3000,  cat:'片付け' },
  truck:           { label:'運搬車両費',           unit:'台', price:15000,  cat:'片付け' },
  // --- 片付け：家電リサイクル・処理困難物（台/個） ---
  refrigerator:    { label:'冷蔵庫リサイクル',     unit:'台', price:6500,   cat:'リサイクル' },
  tv:              { label:'テレビリサイクル',     unit:'台', price:4000,   cat:'リサイクル' },
  washer:          { label:'洗濯機リサイクル',     unit:'台', price:4500,   cat:'リサイクル' },
  aircon:          { label:'エアコンリサイクル',   unit:'台', price:4000,   cat:'リサイクル' },
  mattress:        { label:'マットレス(スプリング)', unit:'枚', price:3500, cat:'リサイクル' },
  hardItem:        { label:'処理困難物(消火器・金庫等)', unit:'個', price:5000, cat:'リサイクル' },
};

const DEFAULT_OVERHEAD = 10; // 諸経費率(%)

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function freshState(){
  return {
    company:{
      name:'LCC株式会社',
      address:'島根県出雲市知井宮町137番地2',
      tel:'0853-27-9320',
      person:'',
    },
    customer:{ name:'', project:'', site:'' },
    rates: deepClone(DEFAULT_RATES),
    overhead: DEFAULT_OVERHEAD,
    // 解体入力
    demo:{
      area:30, floors:'1', structure:'wood',
      roof:'tile', // tile(瓦・金属)/slate/asbestos
      block:0, doma:0, trees:0,
      difficulty:'standard', // standard / narrow / hand
      guardDays:0,
      asbestosSurvey:false,
    },
    // 片付け入力
    clean:{
      volume:6, condition:'standard', // standard/mixed/yashiki
      stairFloors:0, workers:2, trucks:1,
      refrigerator:0, tv:0, washer:0, aircon:0, mattress:0, hardItem:0,
    },
  };
}

const app = createApp({
  setup(){
    const tab = ref('demo'); // demo / clean / settings / preview
    const showOpening = ref(true);
    const state = reactive(freshState());
    const toast = ref('');

    /* ===== 保存・読込 ===== */
    function save(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }
    function load(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          const d = JSON.parse(raw);
          // ratesは新項目が増えてもデフォルトとマージ
          const merged = deepClone(DEFAULT_RATES);
          if(d.rates){ for(const k in d.rates){ if(merged[k]) merged[k].price = d.rates[k].price; } }
          Object.assign(state, d, { rates: merged });
        }
      }catch(e){}
    }
    function resetRates(){
      if(confirm('単価を初期値に戻しますか？')){
        state.rates = deepClone(DEFAULT_RATES);
        state.overhead = DEFAULT_OVERHEAD;
        showToast('単価を初期化しました');
      }
    }
    function showToast(msg){ toast.value = msg; setTimeout(()=>toast.value='', 1800); }

    onMounted(()=>{
      load();
      setTimeout(()=>{
        const op = document.getElementById('opening');
        if(op) op.classList.add('fade-out');
        setTimeout(()=>{ showOpening.value=false; }, 1000);
      }, 3000);
    });
    watch(state, ()=>save(), { deep:true });

    const yen = n => '¥' + Math.round(n||0).toLocaleString('ja-JP');

    /* ===== 係数 ===== */
    const FOUNDATION_COEF = 0.20; // 基礎コンガラ ㎥/㎡
    const WOOD_COEF       = 0.28; // 木くず ㎥/㎡
    const SCAFFOLD_1F     = 1.5;  // 足場係数（平屋）
    const SCAFFOLD_2F     = 2.2;  // 足場係数（2階建）

    /* ===== 解体明細 ===== */
    const demoItems = computed(()=>{
      const d = state.demo, r = state.rates;
      const area = Number(d.area)||0;
      const items = [];
      const push = (cat,label,qty,unit,price)=>{
        qty = Math.round((Number(qty)||0)*100)/100;
        if(qty>0 && price>0) items.push({cat,label,qty,unit,price,amount:qty*price});
      };

      // 混合ゴミ係数（構造で変化：木造0.05 / S造0.03）
      const mixedCoef = d.structure==='steel' ? 0.03 : 0.05;
      // 足場
      const scafCoef = d.floors==='2' ? SCAFFOLD_2F : SCAFFOLD_1F;
      const scafArea = area * scafCoef;

      // 難易度係数（上屋作業費＝人工へ加算）
      const diffCoef = d.difficulty==='hand' ? 1.8 : (d.difficulty==='narrow' ? 1.3 : 1.0);

      /* --- 仮設工事 --- */
      push('【仮設工事】', r.scaffold.label, scafArea, r.scaffold.unit, r.scaffold.price);
      push('【仮設工事】', r.soundSheet.label, scafArea, r.soundSheet.unit, r.soundSheet.price);
      push('【仮設工事】', r.machineTransport.label, 1, r.machineTransport.unit, r.machineTransport.price);

      /* --- 解体本体工事 --- */
      if(d.structure==='steel'){
        push('【解体工事】', r.steelDemolish.label, area, r.steelDemolish.unit, r.steelDemolish.price);
      }else{
        push('【解体工事】', r.woodDemolish.label, area, r.woodDemolish.unit, r.woodDemolish.price);
      }
      push('【解体工事】', r.foundation.label, area, r.foundation.unit, r.foundation.price);

      // 難易度割増（人工）：標準以外で発生
      if(diffCoef>1.0){
        const extraLabor = area * 0.06; // 延床に応じた手壊し人工目安
        push('【解体工事】', r.laborDemo.label+'（難易度割増×'+diffCoef+'）',
             extraLabor*diffCoef, r.laborDemo.unit, r.laborDemo.price);
      }

      /* --- 廃棄物処分 --- */
      push('【廃棄物処分】', r.concreteDisp.label, area*FOUNDATION_COEF, r.concreteDisp.unit, r.concreteDisp.price);
      push('【廃棄物処分】', r.woodDisp.label, area*WOOD_COEF, r.woodDisp.unit, r.woodDisp.price);
      push('【廃棄物処分】', r.mixedDisp.label, area*mixedCoef, r.mixedDisp.unit, r.mixedDisp.price);

      // 屋根材：石綿スレートの場合 特殊処分を屋根面積分で加算
      if(d.roof==='asbestos'){
        const roofArea = (d.floors==='2' ? area/2 : area) * 1.1; // 屋根投影面積目安
        push('【廃棄物処分】', r.asbestosDisp.label, roofArea, r.asbestosDisp.unit, r.asbestosDisp.price);
      }else if(d.roof==='slate'){
        // 化粧スレートは石膏ボード扱いの管理型として少量加算
        push('【廃棄物処分】', r.gypsumDisp.label+'（スレート系）', area*0.02, r.gypsumDisp.unit, r.gypsumDisp.price);
      }

      /* --- 外構・付帯 --- */
      push('【外構・付帯】', r.blockWall.label, d.block, r.blockWall.unit, r.blockWall.price);
      push('【外構・付帯】', r.doma.label, d.doma, r.doma.unit, r.doma.price);
      push('【外構・付帯】', r.treeRemoval.label, d.trees, r.treeRemoval.unit, r.treeRemoval.price);

      /* --- 諸経費・調査 --- */
      if(d.asbestosSurvey || d.roof==='asbestos'){
        push('【調査・諸経費】', r.asbestosSurvey.label, 1, r.asbestosSurvey.unit, r.asbestosSurvey.price);
      }
      push('【調査・諸経費】', r.guard.label, d.guardDays, r.guard.unit, r.guard.price);

      return items;
    });

    /* ===== 片付け明細 ===== */
    const cleanItems = computed(()=>{
      const c = state.clean, r = state.rates;
      const items = [];
      const push = (cat,label,qty,unit,price)=>{
        qty = Math.round((Number(qty)||0)*100)/100;
        if(qty>0 && price>0) items.push({cat,label,qty,unit,price,amount:qty*price});
      };

      // 状態割増
      const condCoef = c.condition==='yashiki' ? 2.0 : (c.condition==='mixed' ? 1.5 : 1.0);
      const condLabel = c.condition==='yashiki' ? '屋敷' : (c.condition==='mixed' ? '混載' : '標準');

      /* --- 廃棄物処分（体積） --- */
      const vol = Number(c.volume)||0;
      if(vol>0){
        items.push({
          cat:'【廃棄物処分】',
          label:'一般ゴミ処分（状態:'+condLabel+'×'+condCoef+'）',
          qty:vol, unit:'㎥', price:r.trashVolume.price*condCoef,
          amount:vol*r.trashVolume.price*condCoef
        });
      }

      /* --- 人件・運搬 --- */
      push('【作業・運搬】', r.worker.label, c.workers, r.worker.unit, r.worker.price);
      // 階段降ろし割増：人数×階数
      const stairQty = (Number(c.stairFloors)||0) * (Number(c.workers)||0);
      push('【作業・運搬】', r.stairFee.label, stairQty, r.stairFee.unit, r.stairFee.price);
      push('【作業・運搬】', r.truck.label, c.trucks, r.truck.unit, r.truck.price);

      /* --- 家電リサイクル・処理困難物 --- */
      push('【リサイクル・困難物】', r.refrigerator.label, c.refrigerator, r.refrigerator.unit, r.refrigerator.price);
      push('【リサイクル・困難物】', r.tv.label, c.tv, r.tv.unit, r.tv.price);
      push('【リサイクル・困難物】', r.washer.label, c.washer, r.washer.unit, r.washer.price);
      push('【リサイクル・困難物】', r.aircon.label, c.aircon, r.aircon.unit, r.aircon.price);
      push('【リサイクル・困難物】', r.mattress.label, c.mattress, r.mattress.unit, r.mattress.price);
      push('【リサイクル・困難物】', r.hardItem.label, c.hardItem, r.hardItem.unit, r.hardItem.price);

      return items;
    });

    /* ===== 統合明細・合計 ===== */
    const allItems = computed(()=>[...demoItems.value, ...cleanItems.value]);

    const groupedItems = computed(()=>{
      const g = {};
      const order = [];
      for(const it of allItems.value){
        if(!g[it.cat]){ g[it.cat]=[]; order.push(it.cat); }
        g[it.cat].push(it);
      }
      return order.map(cat=>({ cat, items:g[cat], sub:g[cat].reduce((s,i)=>s+i.amount,0) }));
    });

    const directTotal = computed(()=> allItems.value.reduce((s,i)=>s+i.amount,0));
    const overheadAmount = computed(()=> Math.round(directTotal.value * (Number(state.overhead)||0)/100));
    const subtotal = computed(()=> directTotal.value + overheadAmount.value);
    const tax = computed(()=> Math.round(subtotal.value * 0.10));
    const total = computed(()=> subtotal.value + tax.value);

    const demoTotal = computed(()=> demoItems.value.reduce((s,i)=>s+i.amount,0));
    const cleanTotal = computed(()=> cleanItems.value.reduce((s,i)=>s+i.amount,0));

    const today = new Date();
    const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
    const validUntil = (()=>{ const d=new Date(); d.setDate(d.getDate()+30);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; })();

    function doPrint(){ window.print(); }

    return {
      tab, showOpening, state, toast,
      yen, demoItems, cleanItems, allItems, groupedItems,
      directTotal, overheadAmount, subtotal, tax, total,
      demoTotal, cleanTotal, dateStr, validUntil,
      resetRates, doPrint, showToast,
    };
  },
  template: `
  <!-- ===== オープニング ===== -->
  <div id="opening" v-if="showOpening">
    <div class="op-logo">L<span>C</span>C</div>
    <div class="op-sub">株式会社</div>
    <div class="op-line"></div>
    <div class="op-sub2">SHIMANE&nbsp;&nbsp;IZUMO</div>
  </div>

  <!-- ===== 本体 ===== -->
  <div class="safe-bottom min-h-screen">
    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-[#0b0b0d] text-white px-4 py-3 flex items-center justify-between shadow-lg" style="padding-top:calc(env(safe-area-inset-top) + 10px)">
      <div class="flex items-center gap-2">
        <span class="font-black text-xl tracking-widest">L<span style="color:var(--lcc-red)">C</span>C</span>
        <span class="text-xs text-gray-400 leading-tight">解体・片付け<br>統合見積システム</span>
      </div>
      <div class="text-right">
        <div class="text-[10px] text-gray-400">税込合計</div>
        <div class="text-lg font-bold" style="color:var(--lcc-red)">{{ yen(total) }}</div>
      </div>
    </header>

    <main class="px-3 pt-3 max-w-2xl mx-auto">

    <!-- ============ 解体タブ ============ -->
    <section v-show="tab==='demo'">
      <div class="card p-4 mb-3">
        <h2 class="font-bold text-gray-800 mb-3 flex items-center gap-2"><span class="w-1.5 h-5 rounded" style="background:var(--lcc-red)"></span>解体工事の積算</h2>

        <label class="block text-sm font-semibold text-gray-600 mb-1">延床面積（㎡）</label>
        <input type="number" v-model.number="state.demo.area" inputmode="decimal" class="w-full border border-gray-300 rounded-xl px-3 py-3 mb-3" placeholder="例：30">

        <label class="block text-sm font-semibold text-gray-600 mb-1">階数</label>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button class="seg-btn rounded-xl py-3 font-semibold border" :class="state.demo.floors==='1'?'text-white border-transparent':'bg-gray-50 text-gray-600 border-gray-300'" :style="state.demo.floors==='1'?'background:var(--lcc-red)':''" @click="state.demo.floors='1'">平屋</button>
          <button class="seg-btn rounded-xl py-3 font-semibold border" :class="state.demo.floors==='2'?'text-white border-transparent':'bg-gray-50 text-gray-600 border-gray-300'" :style="state.demo.floors==='2'?'background:var(--lcc-red)':''" @click="state.demo.floors='2'">2階建</button>
        </div>

        <label class="block text-sm font-semibold text-gray-600 mb-1">構造</label>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button class="seg-btn rounded-xl py-3 font-semibold border" :class="state.demo.structure==='wood'?'text-white border-transparent':'bg-gray-50 text-gray-600 border-gray-300'" :style="state.demo.structure==='wood'?'background:var(--lcc-red)':''" @click="state.demo.structure='wood'">木造</button>
          <button class="seg-btn rounded-xl py-3 font-semibold border" :class="state.demo.structure==='steel'?'text-white border-transparent':'bg-gray-50 text-gray-600 border-gray-300'" :style="state.demo.structure==='steel'?'background:var(--lcc-red)':''" @click="state.demo.structure='steel'">S造（鉄骨）</button>
        </div>
